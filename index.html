<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="국내 여행지, 교통편, 숙소, 추천 코스를 한 번에 찾아보세요.">
<title>여행 하루픽 | 국내 여행 준비</title>
<style>
:root{--ink:#122e32;--muted:#52696a;--line:#dce6e3;--paper:#f4f8f6;--green:#075e50;--mint:#e4f2eb}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.6 system-ui,"Malgun Gothic",sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #268b78;outline-offset:3px}.wrap{width:min(1140px,calc(100% - 48px));margin:auto}header{background:white}header .wrap{display:flex;justify-content:space-between;align-items:center;min-height:72px;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-size:1.18rem;font-weight:850;letter-spacing:-.05em}.brand-icon{display:grid;place-items:center;width:37px;height:37px;border-radius:12px;background:var(--green);color:white}nav{display:flex;gap:24px;font-weight:700;font-size:.94rem}.hero{background:linear-gradient(90deg,#072c31f5,#093b41b0 52%,#123e5015),url('https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d4/Gwangalli_Beach_and_Gwangan_Bridge_Busan.jpg/1280px-Gwangalli_Beach_and_Gwangan_Bridge_Busan.jpg') center 53%/cover,#104e53;color:white;padding:78px 0 93px}.hero .kicker{font-weight:700;color:#c4f2df;margin:0 0 14px}.hero h1{font-size:clamp(2.3rem,6vw,4.25rem);line-height:1.12;letter-spacing:-.075em;margin:0 0 20px}.hero p{margin:0;color:#edf7f2}.search-box{position:relative;margin-top:-41px;background:white;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 14px 38px #123b3012}form{display:grid;grid-template-columns:1.1fr 1.8fr auto;gap:12px;align-items:end}label{display:grid;gap:4px;font-size:.9rem;font-weight:750}input,select{width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;background:#f7faf8;padding:11px 12px;color:var(--ink);height:48px}select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#32695e 50%),linear-gradient(135deg,#32695e 50%,transparent 50%);background-position:calc(100% - 17px) 21px,calc(100% - 12px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:25px}.primary{border:0;border-radius:12px;background:var(--green);color:white;padding:11px 25px;min-height:48px;font-weight:800}.chips,.filters{display:flex;gap:8px;flex-wrap:wrap}.chips{margin-top:14px}.chip{background:white;color:var(--green);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-weight:700;font-size:.9rem}.chip[aria-pressed=true]{background:var(--mint);border-color:#8cc5b5}.results{padding:43px 0 70px}.heading{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}h2{font-size:clamp(1.65rem,4vw,2.25rem);letter-spacing:-.06em;margin:0}.heading p{margin:0;color:var(--muted)}.filters{margin:17px 0 24px}.filter{border:1px solid var(--line);border-radius:10px;background:white;padding:8px 13px;color:var(--ink);font-weight:750}.filter[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:white;border:1px solid var(--line);border-radius:17px;min-width:0;padding:17px;display:flex;flex-direction:column;align-items:flex-start}.icon{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--mint);margin-bottom:10px;font-size:1.25rem}.meta{font-size:.875rem;font-weight:750;color:var(--green);margin:0}.card h3{font-size:1.15rem;letter-spacing:-.04em;margin:3px 0 5px}.card .desc{color:var(--muted);margin:0 0 16px;overflow-wrap:anywhere}.card a{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:.89rem;font-weight:750;color:var(--green);margin-top:auto}.card a:hover,.chip:hover{background:var(--mint)}.empty{grid-column:1/-1;padding:24px;background:white;border-radius:12px}.foot{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:.92rem}.course{margin:0 0 16px;padding-left:21px;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){.wrap{width:calc(100% - 28px)}header .wrap{min-height:60px}nav{gap:10px;font-size:.82rem}.hero{padding:54px 0 75px}.search-box{padding:13px;margin-top:-33px}form{grid-template-columns:1fr 1fr;gap:8px}form button{grid-column:1/-1}.grid{grid-template-columns:1fr}.results{padding-top:30px}}
nav{align-items:center}.join-link{background:var(--green);color:white;border-radius:9px;padding:6px 12px;white-space:nowrap}@media(max-width:650px){header .wrap{flex-wrap:wrap;gap:4px;padding:9px 0}nav{width:100%;justify-content:space-between;gap:6px;min-height:38px}nav a{white-space:nowrap}nav{flex-wrap:wrap;justify-content:flex-start;column-gap:12px}}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.card-actions a{margin:0}.card-actions .course-plan{background:var(--green);border-color:var(--green);color:white}.card-actions .course-plan:hover{background:#034a3f}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.course-profile{display:flex;flex-wrap:wrap;gap:5px;margin:3px 0 13px;max-width:100%;color:var(--green);font-size:.875rem;font-weight:700}.course-profile span{background:var(--mint);border-radius:6px;padding:2px 6px}
.course-conditions{border:1px solid var(--line);border-radius:14px;padding:12px 16px 15px;margin:0 0 20px;min-inline-size:0;background:white}.course-conditions legend{font-weight:750;padding:0 6px}.course-condition-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.course-condition-row .chips{margin:0}.course-condition-reset{background:transparent;border:0;color:var(--green);text-decoration:underline;font-weight:700;font-size:.9rem;padding:5px}.course-condition-help{color:var(--muted);font-size:.9rem;margin:8px 0 0}
</style>
<link rel="stylesheet" href="./course-transport.css">
</head>
<body>
<header><div class="wrap"><a class="brand" href="#top"><span class="brand-icon" aria-hidden="true">✧</span>여행 하루픽</a><nav aria-label="주 메뉴"><a href="#search">여행 검색</a><a href="#results" id="course-nav">추천 코스</a><a href="./my-trip.html">내 여행</a><a href="./budget.html">예산 계산기</a><a href="./login.html">로그인</a><a class="join-link" href="./signup.html">회원가입</a></nav></div></header>
<main id="top">
<section class="hero"><div class="wrap"><p class="kicker">국내 여행 준비</p><h1>어디로 떠날까요?<br>여행 준비를 한곳에서.</h1><p>가볼 곳부터 가는 방법, 머물 동네, 추천 동선까지 찾아보세요.</p></div></section>
<section class="wrap search-box" id="search" aria-label="여행 검색">
<form id="search-form"><label for="region">여행 지역<select id="region"><option value="">전체 지역</option><option>부산</option><option>경주</option><option>제주</option><option>강릉</option></select></label><label for="keyword">검색어<input id="keyword" type="search" placeholder="예: 바다, KTX, 해운대"></label><button class="primary">여행 정보 검색</button></form>
<div class="chips" id="cities" aria-label="지역 바로 선택"></div></section>
<section class="results wrap" id="results"><div class="heading"><h2>여행 정보 모아보기</h2><p id="summary" role="status"></p></div><div class="filters" id="filters" aria-label="결과 유형"></div><fieldset id="course-conditions" class="course-conditions" aria-describedby="course-condition-help" hidden>
<legend>내 조건으로 코스 찾기</legend>
<div class="course-condition-row"><div class="chips" id="course-condition-buttons"></div><button type="button" id="clear-course-conditions" class="course-condition-reset" hidden>조건 초기화</button></div>
<p id="course-condition-help" class="course-condition-help">여러 조건을 고르면 모두 맞는 코스가 표시됩니다. ‘차 없이’는 대중교통이나 도보 기준입니다.</p>
</fieldset><div class="grid" id="cards"></div></section>
</main>
<footer class="foot"><div class="wrap">교통편 운행 시간, 숙소 요금·객실 현황, 관광지 운영 시간은 연결된 페이지에서 확인하세요.<br>광안리 사진 · <a href="https://commons.wikimedia.org/wiki/File:Gwangalli_Beach_and_Gwangan_Bridge_Busan.jpg">Masterhatch</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a></div></footer>
<script type="module" src="app.js"></script>
</body></html>
