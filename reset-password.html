72자로 입력해 주세요.</small><label for="new-password-confirm">새 비밀번호 확인</label><input id="new-password-confirm" name="confirmation" type="password" autocomplete="new-password" maxlength="72" required><button class="primary" type="submit">새 비밀번호 저장</button></fieldset></form><p class="switch"><a href="./login.html">로그인으로 돌아가기</a></p><noscript><p class="notice">이 기능을 사용하려면 JavaScript를 켜 주세요.</p></noscript></main></body></html>
