<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>로그인 | 여행 하루픽</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./account.css"><link rel="stylesheet" href="./ui.css"><link rel="stylesheet" href="./auth.css"><script type="module" src="./auth-ui.js"></script></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="./index.html" aria-label="여행 하루픽 홈"><span class="brand-mark"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M7 23V10a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v13" stroke="currentColor" stroke-width="2.2"/><path d="m10 21 6-8 6 8M12 18h8M6 25h20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="brand-word">하루픽<small>HARUPICK</small></span></a><nav class="main-nav" aria-label="주 메뉴"><a href="./index.html#destinations">여행지 찾기</a><a href="./index.html?view=courses#results">추천 코스</a><a href="./budget.html">예산 계산기</a></nav><a class="header-trip" href="./my-trip.html">내 여행 <span aria-hidden="true">+</span></a></div></header><main class="panel auth-panel"><h1>로그인</h1><p>이메일로 로그인하고 나만의 여행을 준비하세요.</p><p class="notice" id="login-status" role="status">가입한 이메일과 비밀번호를 입력해 주세요.</p><form id="login-form" method="post"><fieldset id="login-fields" disabled><legend class="sr-only">로그인 정보</legend><label for="login-email">이메일</label><input id="login-email" name="email" type="email" autocomplete="username" maxlength="254" required><label for="login-password">비밀번호</label><input id="login-password" name="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">로그인</button></fieldset></form><section id="member-setup" hidden><h2>하루픽 닉네임 등록</h2><p>인증된 계정으로 하루픽에 사용할 닉네임을 등록해 주세요.</p><form id="member-form" method="post"><label for="member-nickname">닉네임</label><input id="member-nickname" name="nickname" autocomplete="nickname" minlength="2" maxlength="30" required><button class="primary" type="submit">하루픽 회원 등록</button><p id="member-feedback" role="status"></p></form></section><div class="actions"><a href="./reset-password.html">비밀번호 재설정</a><a href="./my-trip.html">로그인 없이 일정 만들기</a></div><p class="switch">처음 오셨나요? <a href="./signup.html">회원가입</a></p><noscript><p class="notice">이 기능을 사용하려면 JavaScript를 켜 주세요.</p></noscript></main></body></html>
