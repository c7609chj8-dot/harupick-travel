<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 | 여행 하루픽</title>
<link rel="stylesheet" href="./account.css">
<script type="module" src="./signup.js"></script>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./ui.css">
</head>
<body>
<header class="site-header"><div class="header-inner"><a class="brand" href="./index.html" aria-label="여행 하루픽 홈"><span class="brand-mark"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M7 23V10a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v13" stroke="currentColor" stroke-width="2.2"/><path d="m10 21 6-8 6 8M12 18h8M6 25h20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="brand-word">하루픽<small>HARUPICK</small></span></a><nav class="main-nav" aria-label="주 메뉴"><a href="./index.html#destinations">여행지 찾기</a><a href="./index.html?view=courses#results">추천 코스</a><a href="./budget.html">예산 계산기</a></nav><a class="header-trip" href="./my-trip.html">내 여행 <span aria-hidden="true">+</span></a></div></header>
<main class="panel">
<h1>회원가입</h1>

<p>여행 하루픽 계정을 만들어 마음에 드는 코스를 모아보세요.</p>
<p class="notice" id="account-status" role="status">회원가입 체험 화면입니다. 입력한 정보는 전송하거나 저장하지 않아요.</p>
<form id="signup-form" aria-describedby="account-status">
<fieldset id="signup-fields" disabled>
<legend class="sr-only">가입 정보</legend>
<label>닉네임<input id="nickname" type="text" autocomplete="nickname" minlength="2" maxlength="30" required></label>
<label>이메일<input id="email" type="email" autocomplete="email" maxlength="254" required></label>
<label>비밀번호<input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required aria-describedby="password-help"></label>
<small id="password-help">비밀번호는 8자 이상으로 입력하세요.</small>
<label>비밀번호 확인<input id="confirmation" type="password" autocomplete="new-password" required></label>
<button type="submit">가입 체험하기</button>
</fieldset>
</form>
<noscript><p>가입 화면을 체험하려면 자바스크립트를 켜 주세요.</p></noscript>
<p class="switch">이미 계정이 있나요? <a href="./login.html">로그인</a></p>
</main>
</body>
</html>
